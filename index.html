<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grok Bot Timeline — Per Larsen fleet</title>
<meta name="theme-color" content="#F5F1EB" />
<style>
/* Palette: Brunello Cucinelli–inspired — cashmere cream, stone, taupe, camel, sage, terracotta, wine, espresso */
:root{
  --bg:#F5F1EB; --panel:#EFEAE2; --surface:#E8E2D9; --head:#E3DBCF; --head-hi:#DCD2C4; --taupe:#D4C8B8;
  --border:#D9D0C3; --border2:#E6DFD5; --grid:#EDE7DE; --grid-strong:#DDD4C7;
  --text:#3D3935; --muted:#7A6F66; --dim:#A39888; --ivory:#FBF8F3;
  --routine:#8A9178; --routine-d:#E1E3D6;   /* soft sage / olive taupe */
  --work:#B39573;    --work-d:#EEE4D6;      /* warm sand / camel */
  --waiting:#B5694A; --waiting-d:#F2DED3;   /* muted terracotta / burnt sienna */
  --blocked:#7A3B44; --blocked-d:#E9D6D6;   /* deep wine, muted */
  --idle:#B8B2AA;    --idle-d:#ECE9E4;      /* pale ash */
  --paused:#9E948F;  --paused-d:#E7E2DE;    /* warm flannel grey */
  --now:#3B2F2A;                            /* espresso */
  --bus-Commercial:#A6815E; --bus-Private:#8B7D8F; --bus-Meta:#6F7A80; --bus-Archived:#B8B0A5;
  --hdr:236px; --row:50px; --bushdr:34px; --ruler:52px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:var(--ui);
  --shadow:0 1px 2px rgba(61,57,53,.06),0 2px 8px rgba(61,57,53,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.35 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
/* ---------- top bar ---------- */
.topbar{height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--border2)}
.logo{width:32px;height:32px;border-radius:50%;border:1px solid var(--taupe);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:15px;font-style:italic;color:var(--muted);background:var(--ivory);letter-spacing:.5px}
.title h1{margin:0;font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.4px;color:var(--text)}
.title .sub{font-size:10.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}
.lcd{font-family:var(--ui);background:var(--ivory);border:1px solid var(--border);border-radius:999px;padding:5px 14px;
  color:var(--text);font-size:12px;letter-spacing:.3px;white-space:nowrap}
.lcd small{color:var(--dim);font-size:9.5px;letter-spacing:1.6px;margin-right:8px;text-transform:uppercase}
.badge{font-size:10px;font-weight:500;padding:3px 10px;border-radius:999px;color:#5E534A;background:var(--taupe);white-space:nowrap;letter-spacing:.8px;text-transform:uppercase}
.spacer{flex:1}
.built{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.2px}
.built b{color:var(--text);font-weight:500}
/* ---------- toolbar ---------- */
.toolbar{height:44px;display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--border2)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--ivory)}
.seg button{background:none;border:0;padding:4px 13px;font-size:11.5px;color:var(--muted);cursor:pointer;border-right:1px solid var(--border2);letter-spacing:.3px;transition:background .2s,color .2s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--text);background:var(--surface)}
.seg button.on{background:var(--taupe);color:var(--text)}
.seg.days button{padding:4px 10px}
.seg.days button.today{color:var(--waiting)}
.tlabel{font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--dim)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:nowrap;overflow:hidden;letter-spacing:.2px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
/* ---------- arrange window ---------- */
#scroller{position:absolute;top:106px;left:0;right:0;bottom:28px;overflow:auto;background:var(--bg)}
#grid{position:relative;min-height:100%}
.bg-layer{position:absolute;top:0;bottom:0;left:var(--hdr);pointer-events:none;z-index:0}
.weekend{position:absolute;top:0;bottom:0;background:rgba(212,200,184,.16)}
.todaycol{position:absolute;top:0;bottom:0;background:rgba(181,105,74,.035);border-left:1px solid rgba(181,105,74,.22);border-right:1px solid rgba(181,105,74,.10)}
.gridlines{position:absolute;inset:0}
/* ruler */
.ruler{position:sticky;top:0;z-index:30;display:flex;height:var(--ruler);background:var(--panel);border-bottom:1px solid var(--border);box-shadow:0 1px 6px rgba(61,57,53,.05)}
.corner{position:sticky;left:0;z-index:31;width:var(--hdr);min-width:var(--hdr);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:center;padding:0 16px;gap:3px}
.corner .k{white-space:nowrap;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
.corner .v{font-size:12px;color:var(--muted);font-family:var(--serif)}
.corner .v b{color:var(--text);font-weight:600}
.rul{position:relative;flex:none}
.rul .days{position:absolute;top:0;left:0;right:0;height:26px;border-bottom:1px solid var(--border2)}
.rul .ticks{position:absolute;top:26px;left:0;right:0;bottom:0}
.dlab{position:absolute;top:0;height:26px;border-left:1px solid var(--grid-strong);padding:5px 9px;font-family:var(--serif);font-size:13px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;letter-spacing:.3px}
.dlab.we{color:var(--muted);font-style:italic}
.dlab .tag{font-family:var(--ui);font-style:normal;font-size:8.5px;font-weight:600;letter-spacing:1.4px;border:1px solid rgba(181,105,74,.5);color:var(--waiting);border-radius:999px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.dlab .dt{color:var(--dim);font-weight:400;margin-left:5px;font-size:12px}
.tick{position:absolute;bottom:0;height:5px;border-left:1px solid var(--border)}
.tick.major{height:9px;border-color:#C9BEAF}
.tlab{position:absolute;top:5px;font-size:9.5px;color:var(--dim);transform:translateX(3px);white-space:nowrap;letter-spacing:.3px}
/* bus + track rows */
.row{display:flex;position:relative;z-index:1}
.th{position:sticky;left:0;z-index:20;width:var(--hdr);min-width:var(--hdr);background:var(--head);border-right:1px solid var(--border);border-bottom:1px solid var(--border2)}
.lane{position:relative;flex:none;border-bottom:1px solid var(--border2)}
.bus-row .th{height:var(--bushdr);display:flex;align-items:center;gap:8px;padding:0 14px 0 0;cursor:pointer;user-select:none;background:var(--taupe);border-bottom:1px solid #C9BDAD}
.bus-row .th:hover{background:#CCBFAE}
.bus-row .stripe{width:3px;align-self:stretch}
.bus-row .caret{width:12px;color:var(--muted);font-size:8px;transition:transform .2s;margin-left:6px}
.bus-row.collapsed .caret{transform:rotate(-90deg)}
.bus-row .bname{font-weight:600;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase}
.bus-row .bcount{font-size:10.5px;color:#6E635A;margin-left:auto;white-space:nowrap;font-family:var(--serif);font-style:italic}
.bus-row .bcount .w{color:var(--waiting)}
.bus-row .lane{height:var(--bushdr);background:rgba(212,200,184,.22);border-bottom:1px solid var(--border)}
.mini{position:absolute;height:3px;border-radius:2px;opacity:.8}
.bus-row:not(.collapsed) .mini{opacity:.45}
.track .th{height:var(--row);display:flex;align-items:stretch;cursor:default;transition:background .2s}
.track .stripe{width:3px;flex:none;opacity:.85}
.track .num{width:26px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:11px;color:var(--dim);border-right:1px solid var(--border2)}
.track .meta{flex:1;min-width:0;padding:6px 8px 5px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.track .nm{font-family:var(--serif);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;color:var(--text)}
.track .nm .hid{font-family:var(--ui);font-size:8.5px;font-weight:500;color:var(--dim);border:1px solid var(--border);border-radius:999px;padding:0 5px;margin-left:5px;vertical-align:2px;letter-spacing:.6px;text-transform:uppercase}
.track .rl{display:flex;align-items:center;gap:6px;min-width:0}
.track .role{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.2px}
.pill{flex:none;font-size:9px;font-weight:500;padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.5px}
.pill.Working{background:var(--work-d);color:#7E6446;box-shadow:inset 0 0 0 1px rgba(179,149,115,.45)}
.pill.Idle{background:var(--idle-d);color:#857E76;box-shadow:inset 0 0 0 1px rgba(184,178,170,.6)}
.pill.Waiting{background:var(--waiting-d);color:#9A5236;box-shadow:inset 0 0 0 1px rgba(181,105,74,.45)}
.pill.Blocked{background:var(--blocked-d);color:var(--blocked);box-shadow:inset 0 0 0 1px rgba(122,59,68,.4)}
.pill.Paused{background:var(--paused-d);color:#7C736E;box-shadow:inset 0 0 0 1px rgba(158,148,143,.5)}
.ms{display:flex;flex-direction:column;justify-content:center;gap:3px;padding-right:8px}
.ms button{width:18px;height:16px;border:1px solid var(--border);background:var(--ivory);border-radius:3px;font-size:8.5px;font-weight:600;color:var(--dim);cursor:pointer;padding:0;line-height:14px;transition:all .2s}
.ms button:hover{border-color:#C9BEAF;color:var(--muted)}
.ms button.m.on{background:var(--waiting-d);color:#9A5236;border-color:rgba(181,105,74,.5)}
.ms button.s.on{background:var(--routine-d);color:#5F664F;border-color:rgba(138,145,120,.6)}
.track .lane{height:var(--row)}
.track:hover .th{background:var(--head-hi)}
.track:hover .lane{background:rgba(212,200,184,.10)}
.track.muted .clip,.track.dimmed .clip{opacity:.28;filter:saturate(.35)}
.track.muted .nm,.track.dimmed .nm{color:var(--dim)}
.emptyhint{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--serif);font-size:11px;color:#B5AB9E;font-style:italic;white-space:nowrap;pointer-events:none;padding-left:10px;letter-spacing:.2px}
.archived .th{background:#EAE4DB}
.archived .nm{color:var(--dim)}
.archived .lane{background:repeating-linear-gradient(135deg,rgba(61,57,53,.022) 0 6px,transparent 6px 12px)}
.hiddenrow{display:none}
/* clips */
.clip{position:absolute;top:6px;height:calc(var(--row) - 12px);border-radius:3px;overflow:hidden;cursor:pointer;
  --c:var(--work); --cd:var(--work-d);
  background:var(--cd);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 1px 2px rgba(61,57,53,.07);
  transition:box-shadow .2s, transform .2s}
.clip:hover{z-index:5;box-shadow:0 0 0 1px var(--c),0 6px 18px rgba(61,57,53,.14);transform:translateY(-1px)}
.clip .cn{position:absolute;top:0;left:0;right:0;height:15px;padding:0 6px;font-size:10px;font-weight:500;line-height:15px;letter-spacing:.25px;
  color:var(--ivory);background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .body{position:absolute;top:15px;left:0;right:0;bottom:0}
.clip .fill{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 38%,transparent))}
.clip .rest{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(61,57,53,.035) 0 4px,transparent 4px 8px)}
.clip svg{position:absolute;inset:3px 0 3px 0;width:100%;height:calc(100% - 6px);opacity:.5}
.clip .pct{position:absolute;right:5px;bottom:1px;font-size:9px;color:rgba(61,57,53,.6);letter-spacing:.3px}
.clip.k-routine{--c:var(--routine);--cd:var(--routine-d)}
.clip.k-work{--c:var(--work);--cd:var(--work-d)}
.clip.k-waiting{--c:var(--waiting);--cd:var(--waiting-d)}
.clip.k-blocked{--c:var(--blocked);--cd:var(--blocked-d)}
.clip.k-idle,.clip.st-Idle:not(.k-waiting):not(.k-blocked){--c:var(--idle);--cd:var(--idle-d)}
.clip.k-idle .cn,.clip.st-Idle .cn{color:#4A443F}
.clip.k-paused,.clip.st-Paused{--c:var(--paused);--cd:var(--paused-d);opacity:.75}
.clip.k-paused .cn{color:var(--ivory)}
.clip.k-blocked .cn{color:#F6EDEB}
.clip.st-Working{box-shadow:0 1px 3px rgba(61,57,53,.09)}
.clip.k-waiting{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 3px rgba(181,105,74,.14)}}
.clip.future:not(.k-waiting):not(.k-blocked){border-style:dashed;background:color-mix(in srgb,var(--cd) 70%,var(--bg))}
.clip.narrow .cn{padding:0 2px;font-size:0}
/* playhead (NOW) */
.ph{position:absolute;top:0;bottom:-1px;width:0;z-index:6;pointer-events:none;border-left:1px solid var(--now);opacity:.85}
.rul .ph{z-index:3;opacity:1}
.rul .ph .cap{position:absolute;bottom:0;left:-4px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.rul .ph .plab{position:absolute;top:27px;left:6px;font-size:9px;font-weight:500;letter-spacing:1.2px;background:var(--now);color:var(--ivory);padding:1px 7px;border-radius:999px;white-space:nowrap}
.dsub{position:absolute;top:6px;font-family:var(--serif);font-style:italic;font-size:10.5px;color:#B5AB9E;white-space:nowrap;transform:translateX(6px)}
/* footer */
.footer{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;gap:20px;padding:0 22px;font-size:10.5px;color:var(--dim);letter-spacing:.3px;
  background:var(--panel);border-top:1px solid var(--border2)}
.footer b{color:var(--muted);font-weight:600}
/* tooltip */
#tip{position:fixed;z-index:100;pointer-events:none;min-width:230px;max-width:330px;background:rgba(251,248,243,.97);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;box-shadow:0 12px 32px rgba(61,57,53,.14),0 2px 6px rgba(61,57,53,.06);font-size:12px;display:none;color:var(--text)}
#tip .t1{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:7px}
#tip .t1 .sw{width:8px;height:8px;border-radius:50%}
#tip .t2{font-family:var(--serif);font-size:16px;font-weight:500;margin:5px 0 8px;letter-spacing:.2px}
#tip .kv{display:grid;grid-template-columns:74px 1fr;gap:3px 10px;font-size:11.5px}
#tip .kv span:nth-child(odd){color:var(--dim)}
#tip .demo{margin-top:9px;font-size:9.5px;color:var(--muted);font-style:italic;font-family:var(--serif);letter-spacing:.2px}
#tip .bar{height:3px;background:var(--surface);border-radius:2px;margin-top:9px;overflow:hidden}
#tip .bar i{display:block;height:100%}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--taupe);border-radius:6px;border:3px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:#C4B7A5}
::-webkit-scrollbar-corner{background:var(--panel)}
*{scrollbar-color:var(--taupe) var(--panel)}
@media (max-width:1240px){.legend{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">GB</div>
  <div class="title"><h1>Grok Bot Timeline</h1><div class="sub">Per Larsen fleet · arrange view</div></div>
  <div class="lcd" id="lcd"><small>NOW</small><span id="lcdtime">—</span></div>
  <span class="badge" title="Clips are invented from each bot's role; routine slots are illustrative">Demo · live hooks later</span>
  <div class="spacer"></div>
  <div class="built">Build <b>2026-10-09 08:42 CEST</b> · Europe/Stockholm</div>
</header>
<nav class="toolbar">
  <span class="tlabel">Zoom</span>
  <div class="seg" id="zoom"><button data-z="day">Day</button><button data-z="week" class="on">Week</button></div>
  <span class="tlabel">Go to</span>
  <div class="seg days" id="jump"></div>
  <div class="seg"><button id="nowbtn" title="Scroll to now line (N)">Now</button></div>
  <div class="spacer"></div>
  <div class="legend">
    <span><i style="background:var(--routine)"></i>Routine</span>
    <span><i style="background:var(--work)"></i>Workstream</span>
    <span><i style="background:var(--waiting)"></i>Waiting on Per</span>
    <span><i style="background:var(--blocked)"></i>Blocked</span>
    <span><i style="background:var(--idle)"></i>Idle</span>
    <span><i style="background:var(--paused)"></i>Paused</span>
    <span><i style="background:var(--now);width:1px;height:12px;vertical-align:-2px"></i>Now</span>
  </div>
</nav>
<main id="scroller"><div id="grid"></div></main>
<footer class="footer" id="footer"></footer>
<div id="tip"></div>
<script>
const DATA = {"timezone": "Europe/Stockholm", "buses": ["Commercial", "Private", "Meta"], "channels": [{"id": "t01", "name": "Grok Bot", "bus": "Meta", "role": "Fleet coordinator", "status": "Working", "clips": [{"name": "Timeline refresh & Pages republish", "kind": "work", "start": "2026-10-05T12:30+02:00", "end": "2026-10-05T16:00+02:00", "progress": 95, "demo": true, "note": "Public grok-bot-timeline refresh"}, {"name": "Fleet hygiene sweep", "kind": "work", "start": "2026-10-06T09:00+02:00", "end": "2026-10-07T17:00+02:00", "progress": 0, "demo": true}, {"name": "Weekly fleet summary", "kind": "work", "start": "2026-10-09T13:00+02:00", "end": "2026-10-09T17:00+02:00", "progress": 0, "demo": true}]}, {"id": "t02", "name": "Grok Bot Tutorial", "bus": "Meta", "role": "Onboarding course", "status": "Idle", "clips": [{"name": "Lessons 1–20 on standby", "kind": "idle", "start": "2026-10-05T09:00+02:00", "end": "2026-10-05T12:00+02:00", "progress": 100, "demo": true}]}, {"id": "t03", "name": "Grookie", "bus": "Commercial", "role": "Chief of staff", "status": "Working", "clips": [{"name": "Weekday automations ×13", "kind": "routine", "repeat": {"days": ["Mon", "Tue", "Wed", "Thu", "Fri"], "from": "08:00", "to": "09:30"}, "demo": true}, {"name": "Waiting on Per list", "kind": "waiting", "start": "2026-10-05T10:00+02:00", "end": "2026-10-06T14:00+02:00", "progress": 40, "demo": true}, {"name": "Tuesday management meeting", "kind": "routine", "repeat": {"days": ["Tue"], "from": "15:00", "to": "16:30"}, "demo": true}, {"name": "Commercial meeting brief", "kind": "work", "start": "2026-10-05T09:00+02:00", "end": "2026-10-05T11:00+02:00", "progress": 100, "demo": true, "note": "Pack for Tue operational meeting"}, {"name": "Weekend Token Officer audit", "kind": "routine", "repeat": {"days": ["Sat"], "from": "09:00", "to": "10:30"}, "demo": true}]}, {"id": "t04", "name": "Copper Sales Ops", "bus": "Commercial", "role": "Copper CRM + forecast", "status": "Working", "clips": [{"n Paused", "clips": [], "note": "archived"}, {"id": "t23", "name": "DIY Competitor Intel", "bus": "Archived", "role": "Merged into Competitor Intel", "status": "Paused", "clips": [], "note": "archived"}, {"id": "t24", "name": "Haggle Bot", "bus": "Archived", "role": "Deleted stub", "status": "Paused", "clips": [], "note": "archived"}, {"id": "t25", "name": "Life Coach", "bus": "Archived", "role": "Deleted stub", "status": "Paused", "clips": [], "note": "archived"}, {"id": "t26", "name": "Commercial Inbox", "bus": "Archived", "role": "Deleted stub", "status": "Paused", "clips": [], "note": "archived"}, {"id": "t27", "name": "New Bot", "bus": "Archived", "role": "Empty stub", "status": "Paused", "clips": [], "note": "archived"}, {"id": "t28", "name": "New Bot", "bus": "Archived", "role": "Empty stub", "status": "Paused", "clips": [], "note": "archived"}, {"id": "t29", "name": "Friday Commercial (stub)", "bus": "Archived", "role": "Duplicate stub", "status": "Paused", "clips": [], "note": "archived"}], "timeline": {"window": {"start": "2026-10-05T00:00+02:00", "end": "2026-10-12T00:00+02:00", "label": "Mon 5 – Sun 11 Oct 2026"}, "today": "2026-10-05", "timezone": "Europe/Stockholm", "clipsAreDemo": true, "clipKinds": ["routine", "work", "waiting", "blocked", "idle", "paused"], "builtAt": "2026-10-09 08:42 CEST", "note": "Demo clips invented from each bot's role. Live hooks later."}};
const BUS_ORDER = ['Commercial','Private','Meta'];
const DAYN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const W0 = Date.parse(DATA.timeline.window.start);           // Mon 5 Oct 2026 00:00 CEST
const HOURS = 168;
const ZOOM = { week: 9, day: 60 };
let zoom = 'week', pph = ZOOM.week;
const BUILD_H = (() => { const m = /(\d\d):(\d\d)/.exec(DATA.timeline.builtAt||''); return m ? (+m[1] + m[2]/60) : 11; })();
const BUS_ACTIVE = { Commercial:true, Private:true, Meta:true, Archived:false };

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hOf = iso => (Date.parse(iso) - W0) / 3.6e6;
const fmtH = h => { const d = Math.floor(h/24), r = h - d*24, hh = Math.floor(r), mm = Math.round((r-hh)*60);
  return `${DAYN[Math.min(d,6)] ?? ''} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; };
const statusKey = s => s.startsWith('Waiting') ? 'Waiting' : s;
function nowH(){ const h = (Date.now() - W0)/3.6e6; return (h >= 0 && h < HOURS) ? {h, live:true} : {h: BUILD_H, live:false}; }
function seed(str){ let x = 2166136261; for (const ch of str) x = Math.imul(x ^ ch.charCodeAt(0), 16777619); return () => ((x = Math.imul(x ^ (x>>>15), 2246822507) ^ Math.imul(x ^ (x>>>13), 3266489909)) >>> 0) / 4294967296; }
function wave(name, n){ const r = seed(name); let d = ''; for (let i=0;i<n;i++){ const a = 1 + r()*8 * (0.5 + 0.5*Math.sin(i/ n * Math.PI)); const x = (i+.5)*100/n; d += `M${x.toFixed(2)} ${10-a}V${10+a}`; }
  return `<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="${d}" stroke="rgba(61,57,53,.28)" stroke-width="${(60/n).toFixed(2)}" vector-effect="non-scaling-stroke" fill="none"/></svg>`; }

/* Expand clip definitions (one-offs + weekly repeats) into concrete instances in hours-from-week-start */
function instances(bot){
  const out = [];
  for (const c of (bot.clips||[])){
    if (c.repeat){
      const [fh,fm] = c.repeat.from.split(':').map(Number), [th,tm] = c.repeat.to.split(':').map(Number);
      for (const d of c.repeat.days){ const di = DAYN.indexOf(d); out.push({...c, h0: di*24+fh+fm/60, h1: di*24+th+tm/60, rep:true}); }
    } else out.push({...c, h0: hOf(c.start), h1: hOf(c.end)});
  }
  const n = nowH().h;
  for (const i of out){
    if (i.rep || i.progress == null) i.progress = n >= i.h1 ? 100 : n <= i.h0 ? 0 : Math.round((n-i.h0)/(i.h1-i.h0)*100);
    i.state = i.kind === 'waiting' ? 'Waiting on Per' : i.kind === 'blocked' ? 'Blocked' : i.kind === 'paused' ? 'Paused'
            : i.progress >= 100 ? 'Done' : n < i.h0 ? 'Planned' : 'In progress';
    i.future = n < i.h0;
  }
  return out.sort((a,b)=>a.h0-b.h0);
}

const tracks = [];   // {bot, el, bus}
let trackNo = 0;
function trackHTML(bot, archived){
  const no = archived ? '·' : ++trackNo;
  const sk = statusKey(bot.status);
  const busColor = `var(--bus-${archived ? 'Archived' : bot.bus})`;
  const inst = archived ? [] : instances(bot);
  bot._inst = inst;
  const clips = inst.map((c,idx) => {
    const w = Math.max(3, (c.h1-c.h0)*pph), cls = `clip k-${c.kind} st-${sk} ${c.future?'future':''} ${w<34?'narrow':''}`;
    const prog = Math.max(0, Math.min(100, c.progress));
    const showWave = w > 46 && (c.kind==='work' || c.kind==='routine');
    return `<div class="${cls}" data-i="${idx}" style="left:${c.h0*pph}px;width:${w}px">
      <div class="cn">${esc(c.name)}</div>
      <div class="body"><div class="fill" style="width:${prog}%"></div><div class="rest" style="width:${100-prog}%"></div>
      ${showWave ? wave(c.name+idx, Math.max(8, Math.min(90, Math.round(w/5)))) : ''}
      ${w > 70 && !c.rep ? `<span class="pct">${prog}%</span>` : ''}</div></div>`;
  }).join('');
  const hint = archived ? `${esc(bot.note||'archived')}` : (!inst.length ? (bot.note === 'Group room' || /hub/i.test(bot.role) ? 'group room · no scheduled clips this week' : 'no clips') : '');
  return `<div class="row track ${archived?'archived':''}" data-id="${bot.id}" data-bus="${archived?'Archived':bot.bus}">
    <div class="th" title="${esc(bot.name)} — ${esc(bot.note||'')}">
      <div class="stripe" style="background:${busColor}"></div>
      <div class="num">${no}</div>
      <div class="meta">
        <div class="nm">${esc(bot.name)}${bot.hidden?'<span class="hid">hidden</span>':''}</div>
        <div class="rl"><span class="role">${esc(bot.role)}</span><span class="pill ${sk}">${esc(bot.status)}</span></div>
      </div>
      ${archived ? '' : '<div class="ms"><button class="m" title="Mute (dim) track">M</button><button class="s" title="Solo track">S</button></div>'}
    </div>
    <div class="lane" style="width:${HOURS*pph}px">${clips}${hint?`<span class="emptyhint" style="left:${(nowH().h)*pph+6}px">${hint}</span>`:''}<div class="ph"></div></div>
  </div>`;
}
function busHTML(name, bots, archived){
  const counts = {};
  bots.forEach(b => counts[statusKey(b.status)] = (counts[statusKey(b.status)]||0)+1);
  const summary = archived ? `${bots.length} folders` :
    `${bots.length} trk · ${counts.Working||0} wrk${counts.Waiting?` · <span class="w">${counts.Waiting} wait</span>`:''}`;
  const minis = archived ? '' : bots.flatMap(b => instances(b)).map(c => {
    const col = KCOL[c.kind] || 'var(--work)';
    return `<div class="mini" style="left:${c.h0*pph}px;width:${Math.max(2,(c.h1-c.h0)*pph)}px;top:${12 + (c.kind==='waiting'||c.kind==='blocked'?-6:c.kind==='routine'?6:0)}px;background:${col}"></div>`;
  }).join('');
  const collapsed = !BUS_ACTIVE[name];
  return `<div class="row bus-row ${collapsed?'collapsed':''} ${archived?'archived':''}" data-bus="${name}">
    <div class="th"><div class="stripe" style="background:var(--bus-${name})"></div><span class="caret">▼</span>
      <span class="bname" style="color:${archived?'var(--muted)':`var(--bus-${name})`}">${archived?'Archived':name}</span>
      <span class="bcount">${summary}</span></div>
    <div class="lane" style="width:${HOURS*pph}px">${minis}<div class="ph"></div></div></div>`;
}

function rulerHTML(){
  let days = '', ticks = '';
  for (let d=0; d<7; d++){
    const date = new Date(W0 + d*864e5 + 12*3.6e6);
    const dd = date.toLocaleDateString('en-GB',{timeZone:'Europe/Stockholm',day:'2-digit',month:'short'});
    days += `<div class="dlab ${d>=5?'we':''}" style="left:${d*24*pph}px;width:${24*pph}px">${DAYN[d]}<span class="dt">${dd}</span>${d===0?'<span class="tag">TODAY</span>':''}</div>`;
  }
  if (zoom === 'day') for (let h=0; h<HOURS; h+=4) if (h%24) days += `<span class="dsub" style="left:${h*pph}px">${DAYN[Math.floor(h/24)]} · ${String(h%24).padStart(2,'0')}:00</span>`;
  const step = zoom==='week' ? 3 : 1, labStep = zoom==='week' ? 6 : 1;
  for (let h=0; h<=HOURS; h+=step){
    const major = h % 24 === 0;
    ticks += `<div class="tick ${major||h%labStep===0?'major':''}" style="left:${h*pph}px"></div>`;
    if (h % labStep === 0 && h < HOURS && !major) ticks += `<div class="tlab" style="left:${h*pph}px">${String(h%24).padStart(2,'0')}${zoom==='day'?':00':''}</div>`;
  }
  return `<div class="ruler"><div class="corner"><span class="k">Tracks · Mon 5 – Sun 11 Oct</span>
    <span class="v"><b>${DATA.channels.length}</b> active · ${DATA.archived.length} archived</span></div>
    <div class="rul" style="width:${HOURS*pph}px"><div class="days">${days}</div><div class="ticks">${ticks}</div><div class="ph"><div class="cap"></div><span class="plab"></span></div></div></div>`;
}
function bgHTML(){
  const minor = zoom==='week' ? 6 : 1;
  const gl = `background-image:
     linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
     linear-gradient(90deg, var(--grid) 1px, transparent 1px);
     background-size:${24*pph}px 100%, ${minor*pph}px 100%;`;
  return `<div class="bg-layer" style="width:${HOURS*pph}px">
     <div class="gridlines" style="${gl}"></div>
     <div class="weekend" style="left:${120*pph}px;width:${48*pph}px"></div>
     <div class="todaycol" style="left:0;width:${24*pph}px"></div></div>`;
}

function render(){
  tip.style.display = 'none';
  trackNo = 0; tracks.length = 0;
  const grid = document.getElementById('grid');
  grid.style.width = `calc(var(--hdr) + ${HOURS*pph}px)`;
  let html = bgHTML() + rulerHTML();
  for (const bus of BUS_ORDER){
    const bots = DATA.channels.filter(c => c.bus === bus);
    html += busHTML(bus, bots, false) + bots.map(b => trackHTML(b, false)).join('');
  }
  html += busHTML('Archived', DATA.archived, true) + DATA.archived.map(b => trackHTML(b, true)).join('');
  grid.innerHTML = html;
  grid.querySelectorAll('.track').forEach(el => {
    const id = el.dataset.id, bot = [...DATA.channels, ...DATA.archived].find(b => b.id === id);
    tracks.push({el, bot}); el._bot = bot;
    if (!BUS_ACTIVE[el.dataset.bus]) el.classList.add('hiddenrow');
    if (MUTE.has(id)) { el.classList.add('muted'); el.querySelector('.m')?.classList.add('on'); }
    if (SOLO.has(id)) el.querySelector('.s')?.classList.add('on');
  });
  applySolo(); placePlayhead();
}

/* ---------- interactions ---------- */
const MUTE = new Set(), SOLO = new Set();
function applySolo(){ tracks.forEach(t => t.el.classList.toggle('dimmed', SOLO.size > 0 && !SOLO.has(t.bot.id))); }
document.getElementById('grid').addEventListener('click', e => {
  const busRow = e.target.closest('.bus-row .th');
  if (busRow){ const row = busRow.parentElement, bus = row.dataset.bus; BUS_ACTIVE[bus] = !BUS_ACTIVE[bus];
    row.classList.toggle('collapsed', !BUS_ACTIVE[bus]);
    document.querySelectorAll(`.track[data-bus="${bus}"]`).forEach(t => t.classList.toggle('hiddenrow', !BUS_ACTIVE[bus])); return; }
  const btn = e.target.closest('.ms button'); if (!btn) return;
  const tr = btn.closest('.track'), id = tr.dataset.id;
  if (btn.classList.contains('m')){ MUTE.has(id) ? MUTE.delete(id) : MUTE.add(id); tr.classList.toggle('muted'); btn.classList.toggle('on'); }
  else { SOLO.has(id) ? SOLO.delete(id) : SOLO.add(id); btn.classList.toggle('on'); applySolo(); }
});

const tip = document.getElementById('tip'), scroller = document.getElementById('scroller');
var KCOL = {routine:'var(--routine)',work:'var(--work)',waiting:'var(--waiting)',blocked:'var(--blocked)',idle:'var(--idle)',paused:'var(--paused)'};
const KNAME = {routine:'Routine',work:'Workstream',waiting:'Waiting on Per',blocked:'Blocked',idle:'Idle stub',paused:'Paused'};
scroller.addEventListener('mousemove', e => {
  const clip = e.target.closest('.clip');
  if (!clip){ tip.style.display='none'; return; }
  const bot = clip.closest('.track')._bot, c = bot._inst[+clip.dataset.i];
  const col = (bot.status==='Idle' && !['waiting','blocked'].includes(c.kind)) ? 'var(--idle)' : KCOL[c.kind];
  tip.innerHTML = `<div class="t1"><span class="sw" style="background:${col}"></span>${esc(bot.name)} · ${esc(bot.bus)}</div>
    <div class="t2">${esc(c.name)}</div>
    <div class="kv"><span>Type</span><span>${KNAME[c.kind]||c.kind}${c.rep?' (repeats '+c.repeat.days.join('/')+')':''}</span>
      <span>Clip</span><span>${esc(c.state)}</span>
      <span>Bot status</span><span>${esc(bot.status)}</span>
      <span>When</span><span>${fmtH(c.h0)} → ${fmtH(c.h1)} CEST</span>
      <span>Progress</span><span>${c.progress}%</span>
      ${c.note?`<span>Note</span><span>${esc(c.note)}</span>`:''}
      ${c.source?`<span>Source</span><span>${esc(c.source)}</span>`:''}</div>
    <div class="bar"><i style="width:${c.progress}%;background:${col}"></i></div>
    <div class="demo">Demo clip — live hooks later</div>`;
  tip.style.display='block';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = x+'px'; tip.style.top = y+'px';
});
scroller.addEventListener('mouseleave', () => tip.style.display='none');

function placePlayhead(){
  const {h, live} = nowH();
  document.querySelectorAll('.ph').forEach(p => p.style.left = `${h*pph}px`);
  const label = fmtH(h);
  const pl = document.querySelector('.rul .ph .plab'); if (pl) pl.textContent = live ? `NOW ${label.slice(4)}` : `BUILD ${label.slice(4)}`;
  document.getElementById('lcdtime').textContent = live
    ? new Date().toLocaleString('en-GB',{timeZone:'Europe/Stockholm',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' CEST'
    : `Mon 05 Oct ${label.slice(4)} CEST (build)`;
}
function viewW(){ return scroller.clientWidth - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdr')); }
function scrollToHour(h, frac=0.3){ scroller.scrollLeft = Math.max(0, h*pph - viewW()*frac); }
function setZoom(z){
  const centerH = (scroller.scrollLeft + viewW()/2) / pph;
  const nh = nowH().h, nowVisible = nh*pph >= scroller.scrollLeft && nh*pph <= scroller.scrollLeft + viewW();
  zoom = z; pph = ZOOM[z];
  document.querySelectorAll('#zoom button').forEach(b => b.classList.toggle('on', b.dataset.z === z));
  render();
  if (z === 'day' && nowVisible) scrollToHour(nh, 0.3); else scrollToHour(centerH, 0.5);
}
document.getElementById('zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setZoom(b.dataset.z); });
const jump = document.getElementById('jump');
jump.innerHTML = DAYN.map((d,i) => `<button data-d="${i}" class="${i===0?'today':''}">${d}</button>`).join('');
jump.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  const d = +b.dataset.d; if (zoom === 'week') scrollToHour(d*24, 0.02); else scrollToHour(d*24 + 7, 0); });
document.getElementById('nowbtn').addEventListener('click', () => scrollToHour(nowH().h, 0.3));
addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return;
  if (e.key==='d'||e.key==='D') setZoom('day'); else if (e.key==='w'||e.key==='W') setZoom('week'); else if (e.key==='n'||e.key==='N') scrollToHour(nowH().h,0.3); });

/* footer stats */
(() => {
  const ch = DATA.channels, n = s => ch.filter(c => c.status === s).length;
  const clips = ch.reduce((a,c) => a + instances(c).length, 0);
  const waiting = ch.reduce((a,c) => a + instances(c).filter(i => i.kind==='waiting').length, 0);
  document.getElementById('footer').innerHTML =
    `<span><b>${ch.length}</b> active tracks</span><span><b>${n('Working')}</b> working</span><span><b>${n('Waiting on Per')}</b> waiting on Per</span>
     <span><b>${n('Idle')}</b> idle</span><span><b>${n('Paused')}</b> paused</span><span><b>${clips}</b> clip instances (${waiting} waiting on Per)</span>
     <span class="spacer" style="flex:1"></span><span>Keys: <b>D</b> day · <b>W</b> week · <b>N</b> now · click bus header to fold · M/S = mute/solo</span>`;
})();

render();
requestAnimationFrame(() => scrollToHour(0, 0));
setInterval(placePlayhead, 30000);
</script>
</body>
</html>
